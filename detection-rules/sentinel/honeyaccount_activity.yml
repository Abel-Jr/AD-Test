# Unique rule ID - generate with `uuidgen`, never reuse across rules
id: ca4ba227-1fd4-4397-8f6c-b4ca92f4cc0c
name: "Honeyaccount activity"
description: |
  'Detects an activity on a honeyaccount, which is a user account created for the purpose of detecting malicious activity.  
  A honeyaccount is usually not used by any legitimate user, so any activity on it is suspicious.

  Might be a sign of a active directory scanning. My honeyaccount is "svc-sqladmin" in my lab (OU : Managed Service Accounts).
  Event ID with 4662 log and the GUID {3c6529c3-6a6f-44eb-b405-01262df81910}.'
severity: High
status: Available
enabled: true

# Data connector required for this rule to run
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent

# Runs every 25 minutes, analyzing the last 25 minutes of data
# (matches the bin(TimeGenerated, 10m) used in the query)
queryFrequency: PT25M
queryPeriod: PT25M
triggerOperator: gt
triggerThreshold: 0

tactics:
  - Discovery
relevantTechniques:
  - T1087.002 

# KQL query - IpAddress is kept as an output column automatically
# because it's part of the "by" clause in summarize
query: |
  SecurityEvent
  | where EventID == 4662 and not(SubjectUserName endswith "$") and ObjectName contains "3c6529c3-6a6f-44eb-b405-01262df81910"
  | summarize
      count() by  SubjectUserName, SubjectLogonId, bin(TimeGenerated, 25m)

# Maps the SubjectUserName column directly to Sentinel's Account entity - no extend needed
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: SubjectUserName

# Extra context shown in the alert, not tied to an entity
#customDetails:
#  FailedAttemptsCount: FailedAttempts
#  DistinctUsersCount: DistinctUsers
#  TargetedUsers: Users

# One alert per matching row (per Account), not one alert bundling all Accounts together
eventGroupingSettings:
  aggregationKind: AlertPerResult

# Custom alert title/description using the real column name
alertDetailsOverride:
  alertDisplayNameFormat: "User {{SubjectUserName}} showed honeyaccount activity on the domain in the last 25 minutes"
  alertDescriptionFormat: "Honeyaccount activity has been performed by {{SubjectUserName}}. Might be a sign of a scanning activity on the domain."

# Auto-create incidents, and merge repeated alerts from the same IP
# into a single incident instead of spawning a new one each time
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: Selected
    groupByEntities:
      - Account
    groupByAlertDetails: []

suppressionDuration: PT1H
suppressionEnabled: false
tags: []