# Unique rule ID - generate with `uuidgen`, never reuse across rules
id: 07c1a013-13eb-4f21-ab94-7b56d3e31613
name: "AS-REP Roasting attempts"
description: |
  'Detects AS-REP Roasting attempt through the enumeration of Kerberos accounts 
  without pre-authentication (PreAuthType = 0). An attacker targeting at least 7 distinct 
  accounts from the same IP address within a 10-minute window is considered 
  suspicious.
  
  This technique is used by tools such as GetNPUsers.py from Impacket or Rubeus.'
severity: Medium
status: Available
enabled: true

# Data connector required for this rule to run
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent

# Runs every 10 minutes, analyzing the last 15 minutes of data
# (matches the bin(TimeGenerated, 10m) used in the query)
queryFrequency: PT10M
queryPeriod: PT15M
triggerOperator: gt
triggerThreshold: 0

tactics:
  - CredentialAccess
relevantTechniques:
  - T1558.004

# KQL query - IpAddress is kept as an output column automatically
# because it's part of the "by" clause in summarize
query: |
  SecurityEvent
  | where EventID == 4768 //and not(ServiceName endswith "$")
  | extend EventDataStr = tostring(EventData)
  | extend TicketEncryptionType = extract(@'<Data Name="TicketEncryptionType">(.*?)</Data>', 1, EventDataStr)
  | extend Status              = extract(@'<Data Name="Status">(.*?)</Data>', 1, EventDataStr)
  | extend ServiceName         = extract(@'<Data Name="ServiceName">(.*?)</Data>', 1, EventDataStr)
  | extend TargetUserName      = extract(@'<Data Name="TargetUserName">(.*?)</Data>', 1, EventDataStr)
  | extend IpAddress           = extract(@'<Data Name="IpAddress">(.*?)</Data>', 1, EventDataStr)
  | extend PreAuthType           = extract(@'<Data Name="PreAuthType">(.*?)</Data>', 1, EventDataStr)
  | extend TicketOptions       = extract(@'<Data Name="TicketOptions">(.*?)</Data>', 1, EventDataStr)
  | where PreAuthType ==0
  | summarize 
     DistinctAccounts = dcount(TargetUserName),
     Accounts = make_set(TargetUserName,12)
     by IpAddress, PreAuthType, bin(TimeGenerated, 15m)
  | where DistinctAccounts >= 7

# Maps the IpAddress column directly to Sentinel's IP entity - no extend needed
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IpAddress

# Extra context shown in the alert, not tied to an entity
customDetails:
  DistinctCount: DistinctAccounts
  TargetedAccounts: Accounts
  PreAuth: PreAuthType

# One alert per matching row (per IP), not one alert bundling all IPs together
eventGroupingSettings:
  aggregationKind: AlertPerResult

# Custom alert title/description using the real column name
alertDetailsOverride:
  alertDisplayNameFormat: "AS-REP Roasting attempt detected from {{IpAddress}}"
  alertDescriptionFormat: "IP {{IpAddress}} enumerated multiple distinct accounts without pre-authentication in 10 minutes"

# Auto-create incidents, and merge repeated alerts from the same IP
# into a single incident instead of spawning a new one each time
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: Selected
    groupByEntities:
      - IP
    groupByAlertDetails: []

suppressionDuration: PT1H
suppressionEnabled: false
tags: []
