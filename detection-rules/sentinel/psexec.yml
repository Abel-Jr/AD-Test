# Unique rule ID - generate with `uuidgen`, never reuse across rules
id: 89c7e1d0-fb84-42fb-ad17-9c4277c62e00
name: "PSExec attempts"
description: |
  'Detects access to a network share through Event ID 5145.
  Access to a share with a name that matches the regex pattern "\\\\*\\ADMIN$" is characteristic of lateral movement attempts using PSExec.
  An executable file will be on the RelativeTargetName field with AccessMask 0x10080, which is characteristic of a malicious request, as attack tools often force it to facilitate remote execution.
  This technique is used by tools such as psexec from Sysinternals or Impacket.'
severity: High
status: Available
enabled: true

# Data connector required for this rule to run
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent

# Runs every 15 minutes, analyzing the last 20 minutes of data
# (matches the bin(TimeGenerated, 10m) used in the query)
queryFrequency: PT15M
queryPeriod: PT20M
triggerOperator: gt
triggerThreshold: 0

tactics:
  - Execution
relevantTechniques:
  - T1569.002

# KQL query - Computer and SubjectUserName are kept as output columns automatically
# because they're part of the "by" clause in summarize
query: |
   let network_share = SecurityEvent
    | where EventID == 5145 and RelativeTargetName endswith ".exe" and ShareName matches regex @"^\\\\.*\\ADMIN\$" and AccessMask == "0x10080"
    | extend source = "ShareAccess"
    | project IpAddress, SubjectUserName, SubjectLogonId, ShareName, RelativeTargetName, AccessMask, Computer, source;
    let group_membership = SecurityEvent
    | where EventID == '4627'
    | extend EventDataStr = tostring(EventData)
    | extend SubjectUserName = extract(@'<Data Name="TargetUserName">(.*?)</Data>', 1, EventDataStr)
    | extend SubjectLogonId   = extract(@'<Data Name="TargetLogonId">(.*?)</Data>', 1, EventDataStr)
    | extend LogonType  = extract(@'<Data Name="LogonType">(.*?)</Data>', 1, EventDataStr), source = "group_membership"
    | where not(SubjectUserName endswith "$") and LogonType ==3
    | project SubjectUserName, SubjectLogonId, LogonType, Computer, source;
    union network_share, group_membership
    | summarize
      NetworkShare = countif(source == "ShareAccess"),
      GroupMembership = countif(source == "group_membership")
      by SubjectLogonId, SubjectUserName, Computer
    | where NetworkShare >= 1 and GroupMembership >= 1

# Maps the Computer and SubjectUserName columns directly to Sentinel's Host and Account entities - no extend needed
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: SubjectUserName
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer

# Extra context shown in the alert, not tied to an entity
customDetails:
  SessionId: SubjectLogonId
  NetworkShareCount: NetworkShare
  GroupMembershipCount: GroupMembership

# One alert per matching row (per Account and Host), not one alert bundling all IPs together
eventGroupingSettings:
  aggregationKind: AlertPerResult

# Custom alert title/description using the real column name
alertDetailsOverride:
  alertDisplayNameFormat: "PSExec attempt detected on {{Computer}} by {{SubjectUserName}}"
  alertDescriptionFormat: "Remote Execution via PSExec on {{Computer}} has been detected using user {{SubjectUserName}} account."

# Auto-create incidents, and merge repeated alerts from the same IP
# into a single incident instead of spawning a new one each time
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: Selected
    groupByEntities:
      - Host
    groupByAlertDetails: []

suppressionDuration: PT1H
suppressionEnabled: false
tags: []