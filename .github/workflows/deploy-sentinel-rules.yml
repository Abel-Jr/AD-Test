name: Deploy Sentinel Rules

on:
  push:
    branches: [main]
    paths:
      - 'detection-rules/sentinel/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install AzSentinel module
        shell: pwsh
        run: Install-Module -Name AzSentinel -Force -Scope CurrentUser

      - name: Verify module installed
        shell: pwsh
        run: |
          Write-Host "--- Modules disponibles nommés AzSentinel ---"
          Get-Module -ListAvailable AzSentinel

          Write-Host "--- Tentative d'import ---"
          Import-Module AzSentinel -Verbose

          Write-Host "--- Commandes exposées par le module ---"
          Get-Command -Module AzSentinel

      - name: Deploy rules to Sentinel
        shell: pwsh
        run: |
          Import-Module AzSentinel
          Get-ChildItem ./detection-rules/sentinel -Filter *.yml | ForEach-Object {
            Write-Host "Deploying rule: $($_.Name)"
            Set-AzSentinelAlertRule `
              -WorkspaceName "${{ vars.SENTINEL_WORKSPACE_NAME }}" `
              -SubscriptionId "${{ secrets.AZURE_SUBSCRIPTION_ID }}" `
              -SettingsFile $_.FullName
          }