# Unique rule ID - generate with `uuidgen`, never reuse across rules
id: bd2d2282-f7cc-4b03-9e28-476865086dba
name: "Bruteforce attempts targetting either smb, ldap or ntlm protocols"
description: |
  'Detects multiple failed authentication attempts on a single account via event 4625.'
severity: Low
status: Available
enabled: true

# Data connector required for this rule to run
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent

# Runs every 10 minutes, analyzing the last 10 minutes of data
# (matches the bin(TimeGenerated, 10m) used in the query)
queryFrequency: PT10M
queryPeriod: PT10M
triggerOperator: gt
triggerThreshold: 0

tactics:
  - CredentialAccess
relevantTechniques:
  - T1110.001

# KQL query - IpAddress is kept as an output column automatically
# because it's part of the "by" clause in summarize
query: |
  SecurityEvent
  | where EventID == 4625 and not(TargetUserName endswith "$") and not(TargetUserName=="")
  | summarize 
     Failure= count()
     by IpAddress, TargetUserName, Status, SubStatus, bin(TimeGenerated, 15m)
  | where Failure >= 7

# Maps the IpAddress and TargetUserName columns directly to Sentinel's IP and Account entities - no extend needed
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IpAddress
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: TargetUserName

# Extra context shown in the alert, not tied to an entity
customDetails:
  StatusCode: Status
  SubStatus: SubStatus

# One alert per matching row (per IP and Account), not one alert bundling all IPs together
eventGroupingSettings:
  aggregationKind: AlertPerResult

# Custom alert title/description using the real column name
alertDetailsOverride:
  alertDisplayNameFormat: "Bruteforce attempts targetting either smb, ldap or ntlm protocol detected from {{IpAddress}}"
  alertDescriptionFormat: "IP {{IpAddress}} tried to authenticate to many times in 10 minutes"

# Auto-create incidents, and merge repeated alerts from the same IP
# into a single incident instead of spawning a new one each time
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: Selected
    groupByEntities:
      - Account
    groupByAlertDetails: []

suppressionDuration: PT1H
suppressionEnabled: false
tags: []