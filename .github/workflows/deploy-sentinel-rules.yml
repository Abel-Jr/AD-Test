name: Deploy Sentinel Rules

on:
  push:
    branches: [main]
    paths:
      - 'detection-rules/sentinel/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install PyYAML
        run: pip install pyyaml --break-system-packages

      - name: Deploy rules via REST API
        run: python3 deploy_rules.py
        env:
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.SENTINEL_RESOURCE_GROUP }}
          WORKSPACE_NAME: ${{ vars.SENTINEL_WORKSPACE_NAME }}