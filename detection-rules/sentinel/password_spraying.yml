# Unique rule ID - generate with `uuidgen`, never reuse across rules
id: 4b8e2f61-9d3a-47c5-8e12-6f9a1d4b7c85
name: "Password Spraying attempts"
description: |
  'Detects a single IP attempting authentication against a large number of
  distinct accounts in a short window (password spraying) targetting smb, ldap, ntlm protocol, via event 4625.
  kerberos should be logged as event 4771.
  
  A high number of distinct accounts targeted from the same machine is characteristic 
  of a password spray attack — the attacker tests the same password against multiple 
  accounts to avoid account lockout. The threshold is set at 25 distinct accounts (which won't be the case on a real environment).'
severity: High
status: Available
enabled: true

# Data connector required for this rule to run
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent

# Runs every 10 minutes, analyzing the last 15 minutes of data
# (matches the bin(TimeGenerated, 10m) used in the query)
queryFrequency: PT10M
queryPeriod: PT15M
triggerOperator: gt
triggerThreshold: 0

tactics:
  - CredentialAccess
relevantTechniques:
  - T1110.003

# KQL query - IpAddress is kept as an output column automatically
# because it's part of the "by" clause in summarize
query: |
  SecurityEvent
  | where EventID == 4625
  | summarize
      FailedAttempts = count(),
      DistinctUsers = dcount(TargetUserName),
      Users = make_set(TargetUserName, 20)
      by IpAddress, bin(TimeGenerated, 10m)
  | where DistinctUsers >= 25
  | order by DistinctUsers desc

# Maps the IpAddress column directly to Sentinel's IP entity - no extend needed
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IpAddress

# Extra context shown in the alert, not tied to an entity
customDetails:
  FailedAttemptsCount: FailedAttempts
  DistinctUsersCount: DistinctUsers
  TargetedUsers: Users

# One alert per matching row (per IP), not one alert bundling all IPs together
eventGroupingSettings:
  aggregationKind: AlertPerResult

# Custom alert title/description using the real column name
alertDetailsOverride:
  alertDisplayNameFormat: "Password Spraying detected from {{IpAddress}}"
  alertDescriptionFormat: "IP {{IpAddress}} tried to authenticate to multiple distinct accounts in 10 minutes"

# Auto-create incidents, and merge repeated alerts from the same IP
# into a single incident instead of spawning a new one each time
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: Selected
    groupByEntities:
      - IP
    groupByAlertDetails: []

suppressionDuration: PT1H
suppressionEnabled: false
tags: []