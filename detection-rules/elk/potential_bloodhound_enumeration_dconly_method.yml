name: "Potential BloodHound / AD Enumeration with Domain Controller Only Method"
description: >
  Detects suspicious self-authentication activity on a Domain Controller associated with access to SYSVOL and Group Policy files. 
  The rule correlates a Kerberos network logon (4624), special privilege assignment including SeEnableDelegationPrivilege (4672), 
  SYSVOL share access (5140), and file-level access to SYSVOL (5145) within the same session and a five-minute window. 
  
  It also verifies that the source IP matches one of the Domain Controller's IP addresses and that multiple 
  Group Policy objects are accessed, helping identify potential anomalous delegation or privilege-related activity on 
  the Domain Controller.

author: "Abel-Jr"
severity: high
risk_score: 73
mitre:
  - technique: T1069.001
    tactic: TA0007
    name: "Permission Groups Discovery: Local Groups"
  - technique: T1087.002
    tactic: TA0007
    name: "Account Discovery: Domain Account"
index:
  - winlogbeat-*
interval: 20m
language: esql
query: |
  FROM winlogbeat-*
  | WHERE (
    (event.code == "4624"
      AND winlog.event_data.LogonType == "3"
      AND winlog.event_data.AuthenticationPackageName == "Kerberos")
    OR
    (event.code == "4672")
    OR
    (event.code == "5140"
      AND winlog.event_data.ShareName == "\\\\*\\SYSVOL")
    OR
    (event.code == "5145"
      AND winlog.event_data.ShareName == "\\\\*\\SYSVOL"
      AND winlog.event_data.AccessMask == "0x120089")
  )
  | EVAL session_id = CASE(
    event.code == "4624", winlog.event_data.TargetLogonId,
    winlog.event_data.SubjectLogonId
  )
  | MV_EXPAND winlog.event_data.PrivilegeList
  | EVAL has_delegation_privilege = CASE(
    event.code == "4672"
      AND winlog.event_data.PrivilegeList == "SeEnableDelegationPrivilege",
    1,
    0
  )
  | MV_EXPAND host.ip
  | EVAL self_connect = TO_INTEGER(host.ip == source.ip)
  | EVAL guid = MV_SLICE(
    SPLIT(winlog.event_data.RelativeTargetName, "\\"),
    2,
    2
  )
  | STATS
    unique_events = COUNT_DISTINCT(event.code),
    distinct_policies = COUNT_DISTINCT(guid),
    policies = VALUES(guid),
    account = VALUES(winlog.event_data.SubjectUserName),
    self_connect = MAX(self_connect),
    delegation_privilege = MAX(has_delegation_privilege),
    first_seen = MIN(@timestamp),
    last_seen = MAX(@timestamp)
  BY session_id,
     winlog.computer_name,
     bucket = BUCKET(@timestamp, 5 minute)
  | WHERE unique_events == 4
    AND distinct_policies >= 2
    AND self_connect == 1
    AND delegation_privilege == 1
  | SORT last_seen DESC