name: "Potential Password Spraying"
description: >
  Detects a password spraying attempt through Event ID 4776 (NTLM credential validation).

  A high number of distinct accounts targeted from the same machine is characteristic 
  of a password spray attack — the attacker tests the same password against multiple 
  accounts to avoid account lockout. The threshold is set at 8 distinct accounts.
  
author: "Abel-Jr"
severity: high
risk_score: 70
mitre:
  - technique: T1110.003
    tactic: TA0006
    name: "Brute Force: Password Spraying"
index:
  - winlogbeat-*
interval: 5m
language: esql
query: |
  FROM winlogbeat-*
  | WHERE event.code == "4776"
  | STATS
      distinct_accounts = COUNT_DISTINCT(winlog.event_data.TargetUserName),
      targeted_users    = VALUES(winlog.event_data.TargetUserName),
      hostnames         = VALUES(agent.hostname),
      statuses          = VALUES(winlog.event_data.Status)
    BY host.ip
  | WHERE distinct_accounts >= 8
