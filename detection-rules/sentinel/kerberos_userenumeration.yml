# Unique rule ID - generate with `uuidgen`, never reuse across rules
id: 5276f0da-0e92-4eee-81df-6f9831f12d8a
name: "Kerberos enumeration accounts"
description: |
  'Detects an account enumeration attempt through Event ID 4768 with status 0x6 
  (KDC_ERR_C_PRINCIPAL_UNKNOWN). The domain controller responds differently 
  depending on whether the account exists or not, allowing an attacker to enumerate 
  valid accounts without authentication. At least 5 distinct users from the same IP 
  address within a 10-minute window is considered suspicious.

  This technique is used by tools such as Kerbrute or enum4linux.'
severity: Medium
status: Available
enabled: true

# Data connector required for this rule to run
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent

# Runs every 15 minutes, analyzing the last 20 minutes of data
# (matches the bin(TimeGenerated, 10m) used in the query)
queryFrequency: PT15M
queryPeriod: PT20M
triggerOperator: gt
triggerThreshold: 0

tactics:
  - Discovery
relevantTechniques:
  - T1087.002

# KQL query - IpAddress is kept as an output column automatically
# because it's part of the "by" clause in summarize
query: |
  SecurityEvent
  | where EventID == 4768  and Status == '0x6' and not(TargetUserName endswith "$")
  | summarize 
     DistinctUsers = dcount(TargetUserName),
     Users = make_set(TargetUserName,8)
     by IpAddress, bin(TimeGenerated, 15m)
  | where DistinctUsers >= 5

# Maps the IpAddress column directly to Sentinel's IP entity - no extend needed
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IpAddress

# Extra context shown in the alert, not tied to an entity
customDetails:
  DistinctUsersCount: DistinctUsers
  TargetedUsers: Users

# One alert per matching row (per IP), not one alert bundling all IPs together
eventGroupingSettings:
  aggregationKind: AlertPerResult

# Custom alert title/description using the real column name
alertDetailsOverride:
  alertDisplayNameFormat: "Kerberos enumeration detected from {{IpAddress}}"
  alertDescriptionFormat: "IP {{IpAddress}} requested multiple tgt tickets for multiple unknown users in 10 minutes"

# Auto-create incidents, and merge repeated alerts from the same IP
# into a single incident instead of spawning a new one each time
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: Selected
    groupByEntities:
      - IP
    groupByAlertDetails: []

suppressionDuration: PT1H
suppressionEnabled: false
tags: []