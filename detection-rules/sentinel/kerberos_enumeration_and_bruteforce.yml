# Unique rule ID - generate with `uuidgen`, never reuse across rules
id: e829783d-bfaf-4c7f-9c31-02887a53db91
name: "User enumeration and bruteforce attempts targetting kerberos"
description: |
  'This rule is designed to detect a combination of kerberos enumeration and bruteforce attempts, which may indicate a coordinated attack
  The detection is based on analyzing alerts from two other rules : 
  - "Kerberos Enumeration attempts" Analytics rule ID : 5276f0da-0e92-4eee-81df-6f9831f12d8a
  - "Kerberos Bruteforce attempts" Analytics rule ID :  8be1f93a-d707-46dd-91b6-a7dc5f881bf0

  If both types of alerts are detected for the same ip address within a 15-minute window, 
  it indicates a potential coordinated attack from that identity.'
severity: High
status: Available
enabled: true

# Data connector required for this rule to run
requiredDataConnectors:
  - connectorId: SecurityAlerts
    dataTypes:
      - SecurityAlert

# Runs every 10 minutes, analyzing the last 15 minutes of data
# (matches the bin(TimeGenerated, 10m) used in the query)
queryFrequency: PT10M
queryPeriod: PT15M
triggerOperator: gt
triggerThreshold: 0

tactics:
  - CredentialAccess
  - Discovery
relevantTechniques:
  - T1110.001
  - T1087.002



# KQL query - IpAddress is kept as an output column automatically
# because it's part of the "by" clause in summarize
query: |
  let RuleA = "5276f0da-0e92-4eee-81df-6f9831f12d8a";
  let RuleB = "8be1f93a-d707-46dd-91b6-a7dc5f881bf0";
  let CorrelationWindow = 30m;
  let AlertsA =
    SecurityAlert
    | where TimeGenerated >= ago(60m)
    | extend Properties = tostring(ExtendedProperties)
    | extend AnalyticRuleId = extract(
        @'"Analytic Rule Ids".*?([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})',
        1,
        Properties
    )
    | where AnalyticRuleId == RuleA
    | project TimeA = TimeGenerated, AlertA = SystemAlertId, JoinKey = 1;
  let AlertsB =
    SecurityAlert
    | where TimeGenerated >= ago(60m)
    | extend Properties = tostring(ExtendedProperties)
    | extend AnalyticRuleId = extract(
        @'"Analytic Rule Ids".*?([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})',
        1,
        Properties
    )
    | where AnalyticRuleId == RuleB
    | project TimeB = TimeGenerated, AlertB = SystemAlertId, JoinKey = 1;
  AlertsA
  | join kind=inner AlertsB on JoinKey
  | where TimeB between (TimeA .. TimeA + CorrelationWindow)
  | project TimeGenerated = TimeB, AlertA, AlertB, TimeA, TimeB

# Maps the IpAddress column directly to Sentinel's IP entity - no extend needed
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IpAddress

# Extra context shown in the alert, not tied to an entity
#customDetails:
#  FailedAttemptsCount: FailedAttempts
#  DistinctUsersCount: DistinctUsers
#  TargetedUsers: Users

# One alert per matching row (per IP), not one alert bundling all IPs together
eventGroupingSettings:
  aggregationKind: AlertPerResult

# Custom alert title/description using the real column name
alertDetailsOverride:
  alertDisplayNameFormat: "Kerberos enumeration and bruteforce detected from {{IpAddress}}"
  alertDescriptionFormat: "IP {{IpAddress}} tried to perform kerberos enumeration and bruteforce in 10 minutes"

# Auto-create incidents, and merge repeated alerts from the same IP
# into a single incident instead of spawning a new one each time
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: PT5H
    matchingMethod: Selected
    groupByEntities:
      - IP
    groupByAlertDetails: []

suppressionDuration: PT1H
suppressionEnabled: false
tags: []