name: "Potential SAM Dump with High Privilege Account"
description: >
  Detects an attempt to dump the SAM database through Event IDs 4656 (access request), 
  4661 (handle opened), and 4658 (handle closed) on the Security Account Manager object.

  The access masks 0xf003f and 0xf01ff are characteristic of full read/write access to 
  the SAM, which is typical of tools such as secretsdump.py from Impacket, Mimikatz, or CrackMapExec.
  
  Correlation using the same HandleId ensures that all three events are related to the same operation.

author: "Abel-Jr"
severity: critical
risk_score: 90
mitre:
  - technique: T1003.002
    tactic: TA0006
    name: "OS Credential Dumping: Security Account Manager"
index:
  - winlogbeat-*
interval: 5m
language: esql
query: |
  FROM winlogbeat-*
  | WHERE event.code IN ("4656", "4661", "4658")
      AND winlog.event_data.ObjectServer == "Security Account Manager"
      AND (
        winlog.event_data.AccessMask == "0xf003f"
        OR winlog.event_data.AccessMask == "0xf01ff"
        OR event.code == "4658"
      )
  | STATS
      event_codes    = VALUES(event.code),
      masks          = VALUES(winlog.event_data.AccessMask),
      distinct_codes = COUNT_DISTINCT(event.code)
    BY winlog.event_data.HandleId,
       host.ip
  | WHERE distinct_codes == 3
