name: "Potential BloodHound / AD Enumeration via SAM"
description: >
  Detects an Active Directory enumeration attempt via SAM/SAMR pipes, characteristic of tools such as BloodHound, 
  CrackMapExec, or Impacket.

  The rule correlates four distinct event types within the same session: IPC$ access (5140), samr pipe access (5145),  
  SAM handle opening (4661), and enumeration of sensitive local groups (4799) targeting the following SIDs:

  S-1-5-32-544 (Administrators)
  S-1-5-32-555 (Remote Desktop Users)
  S-1-5-32-562 (Distributed COM Users)
  S-1-5-32-580 (Network Configuration Operators)

  An alert is triggered only if all four event types are present within the same session and a 5-minute window.

author: "Abel-Jr"
severity: high
risk_score: 73
mitre:
  - technique: T1069.001
    tactic: TA0007
    name: "Permission Groups Discovery: Local Groups"
  - technique: T1087.002
    tactic: TA0007
    name: "Account Discovery: Domain Account"
index:
  - winlogbeat-*
interval: 5m
language: esql
query: |
  FROM winlogbeat-*
  | WHERE (
      event.code == "5140"
      AND winlog.event_data.ShareName == "\\\\*\\IPC$"
    )
    OR (
      event.code == "5145"
      AND winlog.event_data.RelativeTargetName IN ("samr", "lsarpc", "srvsvc")
    )
    OR (
      event.code == "4661"
      AND winlog.event_data.ObjectServer == "Security Account Manager"
      AND winlog.event_data.ObjectType == "SAM_ALIAS"
    )
    OR (
      event.code == "4799"
      AND winlog.event_data.TargetSid IN (
        "S-1-5-32-544",
        "S-1-5-32-555",
        "S-1-5-32-562",
        "S-1-5-32-580"
      )
    )

  | STATS
      unique_events      = COUNT_DISTINCT(event.code),
      distinct_pipes     = COUNT_DISTINCT(winlog.event_data.RelativeTargetName),
      events_list        = VALUES(event.code),
      pipes_seen         = VALUES(winlog.event_data.RelativeTargetName),
      targeted_groups    = VALUES(winlog.event_data.TargetSid),
      distinct_groups    = COUNT_DISTINCT(winlog.event_data.TargetSid),
      account            = VALUES(winlog.event_data.SubjectUserName),
      source_ip          = VALUES(source.ip),
      first_seen         = MIN(@timestamp),
      last_seen          = MAX(@timestamp)
    BY winlog.event_data.SubjectLogonId,
       winlog.computer_name,
       bucket = BUCKET(@timestamp, 5 minute)

  | WHERE unique_events == 4 AND distinct_pipes >= 2
  | SORT last_seen DESC
